input:
  datasets:
    - id: "oliver_plot1_part1"
      images_dir: "D:/TreeDetector-data/oliver/19_4_Plocha_1_part1"
      annotations_dir: "D:/TreeDetector-data/oliver/19_4_Plocha_1_part1"
    - id: "oliver_hotove_stromceky"
      images_dir: "D:/TreeDetector-data/oliver/hotove-stromceky"
      annotations_dir: "D:/TreeDetector-data/oliver/hotove-stromceky"
    - id: "marek_2026_tiles_1024"
      images_dir: "D:/TreeDetector-data/Marek/1.2.2026_tiles_1024"
      annotations_dir: "D:/TreeDetector-data/Marek/1.2.2026_tiles_1024"
dataset:
  output_dir: "datasets/benchmark_v4"
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15
  random_seed: 42
  split_mode: "random"
  rebuild_split: false
  copy_mode: "copy"
  exclude_images_with_labels: ["zmladenie"]
  exclude_images_with_shape_types: ["circle"]
classes:
  0: "tree"
  1: "TreeGroup"
models:
  yolo:
    enabled: true
    task: "segmentation"
    weights: "yolo11m-seg.pt"
  mask2former:
    enabled: true
    model_name: "facebook/mask2former-swin-tiny-coco-instance"
    revision: "22c4a2f15dc88149b8b8d9f4d42c54431fbd66f6"
    image_size: 512
    batch_size: 1
    gradient_accumulation_steps: 4
    learning_rate: 0.00005
    weight_decay: 0.01
    epochs: 30
    patience: 7
    max_grad_norm: 1.0
    seed: 42
    device: "cuda"
    mixed_precision: false
training:
  epochs: 100
  imgsz: 640
  batch: 8
  patience: 20
  workers: 4
  seed: 42
  pretrained: true
  device: "auto"
evaluation:
  confidence_threshold: 0.25
  iou_threshold: 0.50
  save_visualizations: true
  visualization_count: 20
